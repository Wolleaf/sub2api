name: Custom OAuth Fast image

on:
  push:
    branches:
      - feat/one-click-weekly-bypass-v0.1.185
    tags:
      - custom-v0.1.185-oauth-fast.*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wolleaf/sub2api
  CUSTOM_VERSION: 0.1.185-oauth-fast.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6

      - name: Set build metadata
        id: metadata
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/custom-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/custom-v') }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CUSTOM_VERSION }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.CUSTOM_VERSION }}
          build-args: |
            VERSION=${{ env.CUSTOM_VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha,scope=custom-oauth-fast-weekly-bypass-amd64
          cache-to: type=gha,mode=max,scope=custom-oauth-fast-weekly-bypass-amd64
          provenance: mode=max
